aid: staircase
name: Staircase
description: >-
  Staircase, Inc. operates the Elephant Protocol (elephant.xyz), a decentralized
  property-data network that aggregates and cryptographically verifies fragmented
  county property and address records into trusted, agent-consumable data. It
  publishes 500,000+ enriched property data points and an unusually agent-native
  developer surface: a Model Context Protocol (MCP) server (@elephant-xyz/mcp,
  both stdio and hosted), an Elephant CLI (@elephant-xyz/cli) for oracle data
  transformation and on-chain proof submission to Polygon, a fact-sheet generator,
  and a library of 14 published Agent Skills for county-data ingestion. An
  Enterprise API is offered to organizations at scale. Backed by Bessemer Venture
  Partners; originally a mortgage-technology API company, now focused on real
  estate data infrastructure.
